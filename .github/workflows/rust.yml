name: Rust

on:
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - name: Git Setup
      run: |
        mkdir -p ~/.ssh
        echo 'Host ${{ vars.SERVER_IP }} ' >> ~/.ssh/config
        echo '    HostName ${{ vars.SERVER_IP }}' >> ~/.ssh/config
        echo '    Port ${{ vars.SERVER_SSH_PORT }}' >> ~/.ssh/config
        cat  ~/.ssh/config

    - uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.DEPLOY_PRIVATE_KEY }} 
        token: ${{ secrets.GITEA_TOKEN }}
        ssh-known-hosts: ${{ secrets.KNOWN_HOSTS }}

    - name: Install rustup
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libusb-1.0-0-dev libftdi1-dev libudev-dev

    - name: Install cargo fmt, clippy
      run: rustup component add rustfmt clippy

    - name: Check Code Formatting
      run: cargo fmt -- --check

    - name: Check Code Linting
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Test
      run: cargo test

    # - name: Generate Documentation
    #   run: cargo doc --no-deps --document-private-items --all-features