[package]
name = "orbiting_sand"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false

[dependencies]
anyhow = "1.0.86"
bevy = { version = "0.14.2", features = ["bevy_debug_stepping"] }
bevy-inspector-egui = "0.26.0"
bevy_egui = "0.29.0"
bevy_eventlistener = "0.8.1"
bevy_mod_picking = { version = "0.20.1", features = ["bevy_picking_raycast"] }
# bytemuck = "1.14.0"
derive_more = { version = "1.0.0", features = ["full"] }
getset = "0.1.2"
hashbrown = { version = "0.15.0", features = ["rayon"] }
itertools = "0.13.0"
lazy_static = "1.5.0"
# nabo = "0.3.0"
ndarray = { version = "0.16.1", features = ["rayon", "serde", "blas"] }
rand = "0.8.5"
rayon = "1.10.0"
strum = "0.26.3"
strum_macros = "0.26.4"
thiserror = "1.0.63"

[dev-dependencies]
iai-callgrind = "0.14.0"
just = "1.23.0"

[[bench]]
name    = "bench_main"
harness = false

[profile.bench]
debug = true

[net]
git-fetch-with-cli = true

[toolchain]
channel = "stable"
components = ["clippy"]

#[lints.rust]
#missing_docs = "deny"

[lints.clippy]
# Enable specific Clippy lints
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic = "warn"
trivially_copy_pass_by_ref = "warn"
inefficient_to_string = "warn"
#missing_docs_in_private_items = "warn"
doc_markdown = "warn"
missing_fields_in_debug = "warn"
redundant_clone = "warn"

# Deny these lints
cast_possible_truncation = "deny"
cast_precision_loss = "deny"

# Allow these lints
too_many_lines = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
