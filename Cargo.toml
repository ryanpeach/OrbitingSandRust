[package]
name = "orbiting_sand"
version = "0.1.0"
edition = "2021"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false

[dependencies]
anyhow = "1.0.86"
bevy = "0.14.2"
bevy-inspector-egui = "0.25.0"
bevy_egui = "0.29.0"
bevy_eventlistener = "0.7.0"
bevy_mod_picking = { version = "0.19.0", features = ["bevy_picking_raycast"] }
# bytemuck = "1.14.0"
bon
conv
derive_more = "0.99.17"
getset = "0.1.2"
hashbrown = { version = "0.14.2", features = ["ahash"] }
itertools = "0.12.1"
# nabo = "0.3.0"
ndarray = { version = "0.15.6", features = ["serde", "blas"] }
rand = "0.8.5"
strum = "0.25.0"
strum_macros = "0.25.3"
thiserror = "1.0.63"

[dev-dependencies]
criterion = { version = "0.4", features = ["html_reports"] }
just = "1.23.0"

[net]
git-fetch-with-cli = true
